server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flowops-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowops}
    username: ${DB_USER:flowops}
    password: ${DB_PASSWORD:flowops}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é criado pelo flowops_ddl.sql, nunca pelo Hibernate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}

logging:
  level:
    root: INFO
    com.flowops: DEBUG
    org.springframework.security: INFO

flowops:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-minimo-256-bits-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # Host para o qual as URLs pre-assinadas sao assinadas. Precisa ser o que
    # o navegador alcanca - dentro do Docker o backend fala com "storage:9000",
    # mas o browser so enxerga "localhost:9000", e a assinatura inclui o host.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:flowops-evidences}
    access-key: ${STORAGE_ACCESS_KEY:flowops}
    secret-key: ${STORAGE_SECRET_KEY:flowops123}
    upload-url-expiration-minutes: ${STORAGE_UPLOAD_URL_EXPIRATION_MINUTES:10}
    download-url-expiration-minutes: ${STORAGE_DOWNLOAD_URL_EXPIRATION_MINUTES:15}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:15}
